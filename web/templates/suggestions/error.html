{{/* Erreur de la page des suggestions. Données : .Lang, .TitleKey, .ErrorKey, .BackURL. */}}
{{define "suggestions/error"}}<!doctype html>
<html lang="{{.Lang}}">
{{template "layout/head" .}}
<body>
<link rel="stylesheet" href="/static/css/suggestions/suggestions.css">
<a class="skip-link" href="#main">{{t "layout.skip"}}</a>
<header class="site-header"><span class="brand">{{t "layout.brand"}}</span></header>
<main id="main" class="site-main">
<h1>{{t .TitleKey}}</h1>
<p role="alert">{{t .ErrorKey}}</p>
</main>
{{template "layout/footer" .}}
</body>
</html>{{end}}
