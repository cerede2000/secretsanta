# Exemple de déploiement. Les secrets viennent de l'environnement (fichier
# .env copié depuis .env.example) : aucune valeur par défaut n'existe, le
# démarrage échoue tant qu'ils ne sont pas fournis.
services:
  secretsanta:
    image: ghcr.io/cerede2000/secretsanta:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      INSTANCE_PASSWORD: ${INSTANCE_PASSWORD:?définir INSTANCE_PASSWORD}
      SIGNING_SECRET: ${SIGNING_SECRET:?définir SIGNING_SECRET}
      # Courrier SMTP (facultatif) :
      # SMTP_HOST: ${SMTP_HOST}
      # SMTP_PORT: ${SMTP_PORT}
      # SMTP_USER: ${SMTP_USER}
      # SMTP_PASSWORD: ${SMTP_PASSWORD}
      # MAIL_FROM: ${MAIL_FROM}
      # Adresse réelle du client derrière un mandataire inverse (facultatif).
      # TRUSTED_PROXIES : adresses/CIDR dont l'en-tête est cru, ou none.
      # Défaut : bouclage et réseaux privés (Traefik, Nginx, Caddy sur l'hôte
      # ou le réseau de conteneurs : rien à régler, ils envoient X-Forwarded-For).
      # TRUSTED_PROXIES: 172.18.0.0/16
      # CLIENT_IP_HEADER : X-Forwarded-For (défaut), X-Real-IP ou CF-Connecting-IP.
      #   Nginx avec « proxy_set_header X-Real-IP $remote_addr; » :
      # CLIENT_IP_HEADER: X-Real-IP
      #   Derrière Cloudflare puis un mandataire local : faire confiance aux
      #   plages Cloudflare (https://www.cloudflare.com/ips/) si l'application
      #   les reçoit directement, et lire :
      # CLIENT_IP_HEADER: CF-Connecting-IP
      # Application exposée directement, sans mandataire :
      # TRUSTED_PROXIES: none
      # Dossier de langues supplémentaires (facultatif, voir volume ci-dessous) :
      # I18N_DIR: /i18n
    volumes:
      - secretsanta-data:/data
      # Facultatif : ajouter une langue sans reconstruire l'image.
      # - ./i18n:/i18n

volumes:
  secretsanta-data:
