# Exemple de déploiement de secretsanta. Aucun secret n'est écrit ici : copiez
# .env.example en .env, remplissez INSTANCE_PASSWORD et SIGNING_SECRET, puis
# lancez « docker compose up -d ».
services:
  secretsanta:
    image: ghcr.io/cerede2000/secretsanta:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      INSTANCE_PASSWORD: ${INSTANCE_PASSWORD:?définir INSTANCE_PASSWORD}
      SIGNING_SECRET: ${SIGNING_SECRET:?définir SIGNING_SECRET}
      # Courrier SMTP (facultatif) :
      # SMTP_HOST: ${SMTP_HOST}
      # SMTP_PORT: ${SMTP_PORT}
      # SMTP_USER: ${SMTP_USER}
      # SMTP_PASSWORD: ${SMTP_PASSWORD}
      # MAIL_FROM: ${MAIL_FROM}
    volumes:
      - secretsanta-data:/data
      # Facultatif : ajouter une langue (variable I18N_DIR=/i18n).
      # - ./i18n:/i18n

volumes:
  secretsanta-data:
