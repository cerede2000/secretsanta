# secretsanta : exemple de déploiement complet avec Docker Compose.
#
# Démarrage rapide :
#   1. cp docker-compose.example.yml docker-compose.yml
#   2. cp .env.example .env     puis renseigner INSTANCE_PASSWORD et SIGNING_SECRET
#      (par exemple : openssl rand -base64 24  et  openssl rand -hex 32),
#      puis chmod 600 .env
#   3. docker compose up -d
#   4. ouvrir PUBLIC_URL, bouton « Commencer »
#
# Aucun secret n'est écrit dans ce fichier : il lit le fichier .env (qui ne doit
# jamais être versionné) et refuse de démarrer tant que INSTANCE_PASSWORD et
# SIGNING_SECRET ne sont pas fournis. Les clés d'API (Brave, Serper) et le mot de
# passe SMTP passent aussi par .env, jamais par ce fichier. La clé privée DKIM,
# elle, se monte en fichier (voir plus bas), jamais en variable.
#
# Toutes les variables sont décrites dans docs/guide/configuration.md et listées
# dans .env.example ; ce fichier ne reprend que les plus courantes.

services:
  secretsanta:
    image: ghcr.io/cerede2000/secretsanta:latest
    # Pour figer une version : ghcr.io/cerede2000/secretsanta:0.1.3
    # (les 4 dernières versions restent disponibles pour un retour arrière).
    container_name: secretsanta
    restart: unless-stopped

    # Utilisateur non root (l'image est « distroless », sans shell). Le volume
    # nommé ci-dessous est initialisé avec les bons droits ; avec un dossier de
    # l'hôte (bind mount), faire d'abord : chown -R 65532:65532 ./data
    user: "65532:65532"
    # Durcissement facultatif mais sans effet sur le fonctionnement : le seul
    # dossier où l'application écrit est /data.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp

    # Port publié. Derrière un mandataire inverse, remplacer par
    # « 127.0.0.1:8080:8080 » (accès local seulement) ou supprimer la section
    # et laisser le mandataire joindre le conteneur par le réseau Docker.
    ports:
      - "8080:8080"

    environment:
      # --- Instance ---------------------------------------------------------
      # Adresse publique, en https en production : elle sert aux liens des
      # courriels et active les cookies « Secure ». Sans barre finale.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # Mot de passe demandé pour créer un groupe, et secret de signature des
      # liens (désinscription, jetons). Obligatoires, sans valeur par défaut.
      INSTANCE_PASSWORD: ${INSTANCE_PASSWORD:?définir INSTANCE_PASSWORD dans .env}
      SIGNING_SECRET: ${SIGNING_SECRET:?définir SIGNING_SECRET dans .env}
      # Fuseau (fenêtre d'envoi des relances, dates) et langue par défaut.
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}
      APP_DEFAULT_LANG: ${APP_DEFAULT_LANG:-fr}

      # --- Courriel SMTP (facultatif, mais recommandé) ------------------------
      # Sans SMTP_HOST l'envoi est désactivé : l'inscription par lien ne peut
      # pas envoyer son code de vérification (l'invité en est informé, et
      # l'organisateur est averti sur son tableau de bord), et aucune relance
      # ni aucun avis ne part. Décommenter ce bloc et renseigner .env :
      # SMTP_HOST: ${SMTP_HOST}
      # SMTP_PORT: ${SMTP_PORT:-587}
      # SMTP_USER: ${SMTP_USER}
      # SMTP_PASSWORD: ${SMTP_PASSWORD}
      # MAIL_FROM: ${MAIL_FROM}               # obligatoire dès que SMTP_HOST est défini
      # MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Père Noël secret}
      # MAIL_TLS_MODE: ${MAIL_TLS_MODE:-starttls}   # starttls (587), tls (465) ou none
      #
      # Délivrabilité : pour que les courriels n'atterrissent pas en spam, le
      # domaine de MAIL_FROM doit publier ses enregistrements DNS :
      #   - SPF   : TXT  « v=spf1 include:<votre-relais> ~all » (ou ip4:<IP du serveur>)
      #   - DKIM  : TXT  <sélecteur>._domainkey  « v=DKIM1; k=rsa; p=<clé publique> »
      #             Soit le relais SMTP signe lui-même (cas le plus courant),
      #             soit l'application signe : voir le bloc DKIM ci-dessous.
      #   - DMARC : TXT  _dmarc  « v=DMARC1; p=none; rua=mailto:dmarc@<domaine> »
      #             (commencer par p=none, resserrer en quarantine puis reject)
      # Et le DNS inverse (PTR) de l'IP d'envoi doit pointer vers MAIL_EHLO_HOSTNAME.
      # Détails pas à pas : docs/guide/deliverability.md.
      # MAIL_EHLO_HOSTNAME: ${MAIL_EHLO_HOSTNAME}
      # MAIL_REPLY_TO: ${MAIL_REPLY_TO}
      # MAIL_MAX_PER_MINUTE: ${MAIL_MAX_PER_MINUTE:-30}
      #
      # Signature DKIM par l'application (tout ou rien ; la clé est un fichier) :
      # MAIL_DKIM_DOMAIN: ${MAIL_DKIM_DOMAIN}
      # MAIL_DKIM_SELECTOR: ${MAIL_DKIM_SELECTOR}
      # MAIL_DKIM_KEY_FILE: /run/secrets/dkim.pem
      # MAIL_DKIM_ALGORITHM: rsa-sha256        # ou ed25519-sha256
      # Relances automatiques (lettre à écrire, lettre à lire) :
      # REMINDERS_ENABLED: ${REMINDERS_ENABLED:-true}

      # --- Derrière un mandataire inverse (Traefik, Caddy, Nginx) -----------
      # L'application a besoin de l'adresse réelle du client pour ses limites
      # anti-abus. Par défaut, elle croit l'en-tête X-Forwarded-For quand la
      # connexion vient du bouclage ou d'un réseau privé : Traefik, Caddy et
      # Nginx dans un réseau Docker n'exigent donc aucun réglage.
      # TRUSTED_PROXIES : adresses ou CIDR (séparés par des virgules) dont l'en-tête
      #   est cru ; « none » pour ne jamais le croire (application exposée seule).
      # TRUSTED_PROXIES: 172.18.0.0/16
      # CLIENT_IP_HEADER : X-Forwarded-For (défaut), X-Real-IP ou CF-Connecting-IP.
      #   Nginx avec « proxy_set_header X-Real-IP $remote_addr; » :
      # CLIENT_IP_HEADER: X-Real-IP
      #   Derrière Cloudflare : CF-Connecting-IP, et TRUSTED_PROXIES = plages
      #   publiées sur https://www.cloudflare.com/ips/ si l'application les reçoit
      #   directement.
      # CLIENT_IP_HEADER: CF-Connecting-IP
      #   Application exposée directement, sans mandataire :
      # TRUSTED_PROXIES: none

      # --- Suggestions d'idées de cadeaux (facultatif) -----------------------
      # SearXNG auto-hébergé ; sans lui, un catalogue de secours embarqué sert.
      # SEARXNG_URL: http://searxng:8080
      # BRAVE_API_KEY: ${BRAVE_API_KEY}
      # SERPER_API_KEY: ${SERPER_API_KEY}

      # --- Langues supplémentaires (facultatif) ------------------------------
      # I18N_DIR: /i18n

    volumes:
      # Données (base SQLite). À sauvegarder : voir README.md.
      - secretsanta-data:/data
      # Facultatif : clé privée DKIM (lecture seule), si l'application signe.
      # - ./dkim.pem:/run/secrets/dkim.pem:ro
      # Facultatif : ajouter une langue sans reconstruire l'image.
      # - ./i18n:/i18n:ro

    # Vérification de santé (déjà définie dans l'image ; reprise ici pour que
    # « docker compose ps » et les mandataires l'utilisent explicitement).
    healthcheck:
      test: ["CMD", "/secretsanta", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    # --- Reverse proxy : choisir UN des trois blocs ci-dessous --------------
    #
    # Traefik (réseau « proxy » déjà créé, résolveur « letsencrypt » configuré) :
    # networks: [proxy]
    # labels:
    #   traefik.enable: "true"
    #   traefik.docker.network: proxy
    #   traefik.http.routers.secretsanta.rule: Host(`noel.example.org`)
    #   traefik.http.routers.secretsanta.entrypoints: websecure
    #   traefik.http.routers.secretsanta.tls.certresolver: letsencrypt
    #   traefik.http.services.secretsanta.loadbalancer.server.port: "8080"
    #
    # Caddy : rien à ajouter ici (retirer « ports »), et dans le Caddyfile :
    #   noel.example.org {
    #       reverse_proxy secretsanta:8080
    #   }
    #
    # Nginx (bloc « server » avec TLS) :
    #   location / {
    #       proxy_pass         http://secretsanta:8080;
    #       proxy_set_header   Host              $host;
    #       proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #       proxy_set_header   X-Forwarded-Proto $scheme;
    #   }
    # Dans les trois cas, mettre PUBLIC_URL=https://noel.example.org dans .env.

volumes:
  secretsanta-data:

# Réseau du mandataire (Traefik), à décommenter avec « networks: [proxy] » :
# networks:
#   proxy:
#     external: true
